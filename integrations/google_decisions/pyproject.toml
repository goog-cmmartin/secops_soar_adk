[project]
name = "soar-integration-google-decisions"
version = "1.4"
description = "Google Gemini Decisions API (gemini-decision-1) Integration for Google SecOps SOAR"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-auth>=2.20.0",
    "requests>=2.28.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
