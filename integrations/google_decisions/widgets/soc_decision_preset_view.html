<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOC Decision Preset - SecOps SOAR Widget</title>
  <style>
    /* ==========================================================================
       Google SecOps SOAR Theme Variables (Self-contained, no CDN dependencies)
       Matches SecOpsSDKEngine & Wiz Predefined HTML Widget Suite
       ========================================================================== */
    :root,
    [data-theme="light"],
    body.light {
      --soar-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Rubik", Helvetica, Arial, sans-serif;
      --soar-font-mono: ui-monospace, SFMono-Regular, "Fira Code", Menlo, Monaco, Consolas, monospace;

      --soar-bg-page: #ffffff;
      --soar-bg-card: #ffffff;
      --soar-bg-subtle: rgba(0, 0, 0, 0.04);
      --soar-border: #e5e7eb;
      --soar-border-strong: #d1d5db;
      --soar-text-primary: #111827;
      --soar-text-secondary: #4b5563;
      --soar-text-muted: #6b7280;
      --soar-accent: #2563eb;
      --soar-accent-hover: #1d4ed8;
      --soar-accent-subtle: rgba(37, 99, 235, 0.1);

      /* Verdicts */
      --verdict-malicious-bg: #fee2e2;
      --verdict-malicious-text: #dc2626;
      --verdict-malicious-border: #fca5a5;

      --verdict-benign-bg: #ecfdf5;
      --verdict-benign-text: #059669;
      --verdict-benign-border: #a7f3d0;

      /* Severities */
      --sev-critical-bg: #fef2f2;
      --sev-critical-text: #dc2626;
      --sev-critical-border: #fca5a5;
      --sev-high-bg: #fff7ed;
      --sev-high-text: #ea580c;
      --sev-high-border: #fdba74;
      --sev-medium-bg: #fffbeb;
      --sev-medium-text: #d97706;
      --sev-medium-border: #fde68a;
      --sev-low-bg: #f3f4f6;
      --sev-low-text: #6b7280;
      --sev-low-border: #d1d5db;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --soar-bg-page: #161626;
        --soar-bg-card: #161626;
        --soar-bg-subtle: rgba(255, 255, 255, 0.06);
        --soar-border: #293140;
        --soar-border-strong: #384357;
        --soar-text-primary: #f3f4f6;
        --soar-text-secondary: #9ca3af;
        --soar-text-muted: #6b7280;
        --soar-accent: #3b82f6;
        --soar-accent-hover: #60a5fa;
        --soar-accent-subtle: rgba(59, 130, 246, 0.16);

        --verdict-malicious-bg: #3b191d;
        --verdict-malicious-text: #ff8589;
        --verdict-malicious-border: #8c1d28;

        --verdict-benign-bg: #132d21;
        --verdict-benign-text: #6ee7b7;
        --verdict-benign-border: #065f46;

        --sev-critical-bg: #450a0a;
        --sev-critical-text: #f87171;
        --sev-critical-border: #7f1d1d;
        --sev-high-bg: #431407;
        --sev-high-text: #fb923c;
        --sev-high-border: #7c2d12;
        --sev-medium-bg: #451a03;
        --sev-medium-text: #fbbf24;
        --sev-medium-border: #78350f;
        --sev-low-bg: #1f2937;
        --sev-low-text: #9ca3af;
        --sev-low-border: #374151;
      }
    }

    [data-theme="dark"], body.dark {
      --soar-bg-page: #161626;
      --soar-bg-card: #161626;
      --soar-bg-subtle: rgba(255, 255, 255, 0.06);
      --soar-border: #293140;
      --soar-border-strong: #384357;
      --soar-text-primary: #f3f4f6;
      --soar-text-secondary: #9ca3af;
      --soar-text-muted: #6b7280;
      --soar-accent: #3b82f6;
      --soar-accent-hover: #60a5fa;
      --soar-accent-subtle: rgba(59, 130, 246, 0.16);

      --verdict-malicious-bg: #3b191d;
      --verdict-malicious-text: #ff8589;
      --verdict-malicious-border: #8c1d28;

      --verdict-benign-bg: #132d21;
      --verdict-benign-text: #6ee7b7;
      --verdict-benign-border: #065f46;

      --sev-critical-bg: #450a0a;
      --sev-critical-text: #f87171;
      --sev-critical-border: #7f1d1d;
      --sev-high-bg: #431407;
      --sev-high-text: #fb923c;
      --sev-high-border: #7c2d12;
      --sev-medium-bg: #451a03;
      --sev-medium-text: #fbbf24;
      --sev-medium-border: #78350f;
      --sev-low-bg: #1f2937;
      --sev-low-text: #9ca3af;
      --sev-low-border: #374151;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background-color: var(--soar-bg-page, #ffffff);
      background: var(--soar-bg-page, #ffffff);
      font-family: var(--soar-font);
      color: var(--soar-text-primary);
      padding: 0.75rem;
      line-height: 1.5;
      font-size: 0.8125rem;
      width: 100%;
      height: auto;
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: var(--soar-bg-page);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--soar-border-strong);
      border-radius: 3px;
    }

    .widget-container {
      width: 100%;
      max-width: 100%;
      margin: 0;
      background: transparent;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    /* Top Summary Header */
    .widget-header-card {
      background: var(--soar-bg-card);
      border: 1px solid var(--soar-border);
      border-radius: 8px;
      padding: 0.95rem 1.2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.85rem;
      flex-wrap: wrap;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .header-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: var(--soar-accent-subtle);
      border: 1px solid var(--soar-accent);
      color: var(--soar-accent);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .header-icon svg {
      width: 20px;
      height: 20px;
    }
    .header-title-group {
      display: flex;
      flex-direction: column;
    }
    .header-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--soar-text-primary);
    }
    .header-subtitle {
      font-size: 0.75rem;
      color: var(--soar-text-muted);
    }

    /* Metrics Grid */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(125px, 1fr));
      gap: 0.7rem;
    }
    .metric-card {
      background: var(--soar-bg-card);
      border: 1px solid var(--soar-border);
      border-radius: 8px;
      padding: 0.7rem 0.95rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }
    .metric-label {
      font-size: 0.6875rem;
      color: var(--soar-text-muted);
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    .metric-value {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--soar-text-primary);
      line-height: 1.2;
    }

    /* Status & Severity Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      font-size: 0.6875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      white-space: nowrap;
      border: 1px solid transparent;
    }
    .badge-open {
      background: var(--verdict-benign-bg);
      color: var(--verdict-benign-text);
      border-color: var(--verdict-benign-border);
    }
    .badge-incident {
      background: var(--verdict-malicious-bg);
      color: var(--verdict-malicious-text);
      border-color: var(--verdict-malicious-border);
    }
    .badge-medium {
      background: var(--sev-medium-bg);
      color: var(--sev-medium-text);
      border-color: var(--sev-medium-border);
    }
    .badge-low {
      background: var(--sev-low-bg);
      color: var(--sev-low-text);
      border-color: var(--sev-low-border);
    }
    .badge-alerting {
      background: var(--soar-accent-subtle);
      color: var(--soar-accent);
      border-color: var(--soar-accent);
    }

    /* Section Titles */
    .section-title {
      font-size: 0.8125rem;
      font-weight: 600;
      margin: 0.15rem 0 0 0;
      color: var(--soar-text-primary);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    /* Filter Toolbar */
    .filter-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.65rem;
      background: var(--soar-bg-card);
      border: 1px solid var(--soar-border);
      border-radius: 8px;
      padding: 0.55rem 0.85rem;
    }
    .filter-tabs {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-wrap: wrap;
    }
    .filter-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--soar-text-muted);
      font-family: var(--soar-font);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.25rem 0.6rem;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }
    .filter-btn:hover {
      color: var(--soar-text-primary);
      background: var(--soar-bg-subtle);
    }
    .filter-btn.active {
      background: var(--soar-accent-subtle);
      color: var(--soar-accent);
      border-color: var(--soar-accent);
    }

    /* Decision Question Cards Grid */
    .questions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 0.75rem;
    }
    .q-card {
      background: var(--soar-bg-card);
      border: 1px solid var(--soar-border);
      border-radius: 8px;
      padding: 0.85rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .q-card.low-confidence {
      border-color: var(--sev-medium-border);
    }
    .q-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.5rem;
      padding-bottom: 0.45rem;
      border-bottom: 1px solid var(--soar-border);
    }
    .q-key-wrap {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }
    .q-key {
      font-family: var(--soar-font-mono);
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--soar-text-primary);
    }
    .q-instructions {
      font-size: 0.75rem;
      color: var(--soar-text-secondary);
      line-height: 1.4;
    }

    /* Progress & Distribution Bars */
    .prob-row {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .prob-label-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.73rem;
      gap: 0.5rem;
    }
    .prob-opt-name {
      color: var(--soar-text-primary);
      font-weight: 600;
      word-break: break-word;
    }
    .prob-opt-desc {
      font-size: 0.6875rem;
      color: var(--soar-text-muted);
      line-height: 1.3;
    }
    .prob-pct {
      font-family: var(--soar-font-mono);
      font-size: 0.73rem;
      font-weight: 700;
      color: var(--soar-text-primary);
      flex-shrink: 0;
    }
    .bar-track {
      width: 100%;
      height: 6px;
      background: var(--soar-bg-subtle);
      border: 1px solid var(--soar-border);
      border-radius: 999px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 999px;
    }

    .criteria-box {
      font-size: 0.6875rem;
      color: var(--soar-text-muted);
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      background: var(--soar-bg-subtle);
      border: 1px solid var(--soar-border);
      padding: 0.45rem 0.6rem;
      border-radius: 6px;
      line-height: 1.35;
    }

    .q-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 0.45rem;
      border-top: 1px solid var(--soar-border);
      font-size: 0.7rem;
      color: var(--soar-text-muted);
      margin-top: auto;
    }

    .empty-banner {
      background: var(--soar-bg-card);
      border: 1px solid var(--soar-border);
      border-radius: 8px;
      padding: 1.25rem;
      text-align: center;
      color: var(--soar-text-muted);
      font-size: 0.75rem;
    }
  </style>
</head>
<body>

  <div id="content" class="widget-container"></div>
  <script id="raw-data" type="application/json">[{stepInstanceName}.JsonResult]</script>

  <script>
    // =========================================================================
    // Google SecOps SOAR Theme Synchronization Bridge
    // =========================================================================
    const SOAR_PALETTES = {
      dark: {
        theme: 'dark',
        '--soar-bg-page': '#161626',
        '--soar-bg-card': '#161626',
        '--soar-border': '#293140',
        '--soar-border-strong': '#384357',
        '--soar-text-primary': '#f3f4f6',
        '--soar-text-secondary': '#9ca3af',
        '--soar-text-muted': '#6b7280'
      },
      light: {
        theme: 'light',
        '--soar-bg-page': '#ffffff',
        '--soar-bg-card': '#ffffff',
        '--soar-border': '#e5e7eb',
        '--soar-border-strong': '#d1d5db',
        '--soar-text-primary': '#111827',
        '--soar-text-secondary': '#4b5563',
        '--soar-text-muted': '#6b7280'
      }
    };

    function isColorDark(color) {
      if (!color) return false;
      let r = 255, g = 255, b = 255;
      color = String(color).trim();
      if (color.startsWith('#')) {
        let hex = color.replace('#', '');
        if (hex.length === 3) {
          hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2];
        }
        if (hex.length >= 6) {
          r = parseInt(hex.substring(0, 2), 16);
          g = parseInt(hex.substring(2, 4), 16);
          b = parseInt(hex.substring(4, 6), 16);
        }
      } else if (color.startsWith('rgb')) {
        const parts = color.match(/\d+/g);
        if (parts && parts.length >= 3) {
          r = parseInt(parts[0], 10);
          g = parseInt(parts[1], 10);
          b = parseInt(parts[2], 10);
        }
      }
      const luminance = (0.299 * r + 0.587 * g + 0.114 * b);
      return luminance < 140;
    }

    function applySoarTheme(themeKeyOrObj) {
      const mode = typeof themeKeyOrObj === 'string' ? themeKeyOrObj : (themeKeyOrObj.theme || 'light');
      document.documentElement.setAttribute('data-theme', mode);
      document.body.className = mode;

      const palette = typeof themeKeyOrObj === 'object' ? themeKeyOrObj : (SOAR_PALETTES[mode] || SOAR_PALETTES.light);
      for (const [key, value] of Object.entries(palette)) {
        if (key.startsWith('--')) {
          document.documentElement.style.setProperty(key, value);
          document.body.style.setProperty(key, value);
        }
      }
      document.body.style.backgroundColor = palette['--soar-bg-page'] || (mode === 'dark' ? '#161626' : '#ffffff');
    }

    window.addEventListener('message', evt => {
      if (evt && evt.data && evt.data.background) {
        const isDark = isColorDark(evt.data.background);
        applySoarTheme(isDark ? SOAR_PALETTES.dark : SOAR_PALETTES.light);
      }
    });

    onmessage = evt => {
      if (evt && evt.data && evt.data.background) {
        const isDark = isColorDark(evt.data.background);
        applySoarTheme(isDark ? SOAR_PALETTES.dark : SOAR_PALETTES.light);
      }
    };

    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      applySoarTheme(SOAR_PALETTES.dark);
    } else {
      applySoarTheme(SOAR_PALETTES.light);
    }

    // =========================================================================
    // Payload Extraction & Formatting
    // =========================================================================
    function extractPayload(input) {
      if (!input) return null;
      let data = input;
      if (typeof data === 'string') {
        const trimmed = data.trim();
        if (trimmed.startsWith('[') && trimmed.includes('.JsonResult')) return null;
        if ((trimmed.startsWith('{') && trimmed.endsWith('}')) || (trimmed.startsWith('[') && trimmed.endsWith(']'))) {
          try { data = JSON.parse(trimmed); } catch (e) { return null; }
        } else {
          return null;
        }
      }
      while (Array.isArray(data) && data.length > 0) {
        const first = data[0];
        if (first && typeof first === 'object' && first.JsonResult) {
          data = first.JsonResult;
        } else {
          data = first;
        }
      }
      if (data && typeof data === 'object' && data.JsonResult) {
        data = data.JsonResult;
      }
      if (typeof data === 'string') {
        try { data = JSON.parse(data); } catch (e) {}
      }
      return (data && typeof data === 'object') ? data : null;
    }

    function escapeHtml(text) {
      if (text === null || text === undefined) return '';
      const div = document.createElement('div');
      div.innerText = String(text);
      return div.innerHTML;
    }

    function formatKeyLabel(key) {
      return String(key || '')
        .replace(/_/g, ' ')
        .replace(/\b\w/g, c => c.toUpperCase());
    }

    // =========================================================================
    // Card Rendering by Question Primitive (noul, choice, score)
    // =========================================================================
    let activePayload = null;
    let activeFilter = 'all';

    function setFilter(filterKey) {
      activeFilter = filterKey;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === filterKey);
      });
      renderCards();
    }

    function renderNoulCard(qKey, ans, meta, threshold) {
      const noul = Number(ans.noul ?? 0);
      const conf = Number(ans.confidence ?? 0);
      const isYes = noul >= 0.50;
      const pctYes = (noul * 100).toFixed(1);
      const confPct = (conf * 100).toFixed(1);
      const isLowConf = conf < threshold;
      const instructions = (meta && meta.instructions) || formatKeyLabel(qKey);

      const isPositiveSafetyGate = /(safe|tuning|authorized|benign|approved|allow|valid|compliant)/i.test(String(qKey || ''));
      const pillClass = isPositiveSafetyGate
        ? (isYes ? 'badge-open' : 'badge-incident')
        : (isYes ? 'badge-incident' : 'badge-open');
      const barColor = isPositiveSafetyGate
        ? (isYes ? 'var(--verdict-benign-text)' : 'var(--verdict-malicious-text)')
        : (isYes ? 'var(--verdict-malicious-text)' : 'var(--verdict-benign-text)');

      let criteriaHtml = '';
      if (meta && meta.criteria && (meta.criteria.true_description || meta.criteria.false_description)) {
        criteriaHtml = `
          <div class="criteria-box">
            ${meta.criteria.true_description ? `<div><strong>Yes:</strong> ${escapeHtml(meta.criteria.true_description)}</div>` : ''}
            ${meta.criteria.false_description ? `<div><strong>No:</strong> ${escapeHtml(meta.criteria.false_description)}</div>` : ''}
          </div>
        `;
      }

      return `
        <div class="q-card ${isLowConf ? 'low-confidence' : ''}">
          <div class="q-header">
            <div class="q-key-wrap">
              <span class="q-key">${escapeHtml(qKey)}</span>
              <span class="badge badge-low" style="width: fit-content;">Yes / No (noul)</span>
            </div>
            <span class="badge ${pillClass}">
              ${isYes ? 'YES' : 'NO'} (${pctYes}%)
            </span>
          </div>
          <div class="q-instructions">${escapeHtml(instructions)}</div>
          <div class="prob-row">
            <div class="prob-label-line">
              <span class="prob-opt-name">P(Yes) Calibrated Probability</span>
              <span class="prob-pct">${pctYes}%</span>
            </div>
            <div class="bar-track">
              <div class="bar-fill" style="width: ${Math.max(2, noul * 100)}%; background: ${barColor};"></div>
            </div>
          </div>
          ${criteriaHtml}
          <div class="q-footer">
            <span>Confidence: <strong>${confPct}%</strong></span>
            <span class="badge ${isLowConf ? 'badge-medium' : 'badge-open'}">
              ${isLowConf ? 'Below Threshold' : 'Confident'}
            </span>
          </div>
        </div>
      `;
    }

    function renderChoiceCard(qKey, ans, meta, threshold) {
      const winner = ans.choice || '';
      const conf = Number(ans.confidence ?? 0);
      const confPct = (conf * 100).toFixed(1);
      const isLowConf = conf < threshold;
      const instructions = (meta && meta.instructions) || formatKeyLabel(qKey);
      const criteriaMap = (meta && meta.criteria && typeof meta.criteria === 'object') ? meta.criteria : {};
      const probs = ans.probabilities || {};

      const sortedOptions = Object.entries(probs).sort((a, b) => Number(b[1]) - Number(a[1]));

      const rowsHtml = sortedOptions.map(([optKey, probVal], idx) => {
        const pct = (Number(probVal) * 100).toFixed(1);
        const isTop = idx === 0 || optKey === winner;
        const optDesc = criteriaMap[optKey] || '';
        const fillStyle = isTop ? 'var(--soar-accent)' : 'var(--soar-text-muted)';
        return `
          <div class="prob-row">
            <div class="prob-label-line">
              <div>
                <span class="prob-opt-name">${escapeHtml(optKey)}</span>
                ${optDesc ? `<div class="prob-opt-desc">${escapeHtml(optDesc)}</div>` : ''}
              </div>
              <span class="prob-pct">${pct}%</span>
            </div>
            <div class="bar-track">
              <div class="bar-fill" style="width: ${Math.max(1.5, Number(probVal) * 100)}%; background: ${fillStyle};"></div>
            </div>
          </div>
        `;
      }).join('');

      return `
        <div class="q-card ${isLowConf ? 'low-confidence' : ''}">
          <div class="q-header">
            <div class="q-key-wrap">
              <span class="q-key">${escapeHtml(qKey)}</span>
              <span class="badge badge-low" style="width: fit-content;">Routing Choice</span>
            </div>
            <span class="badge badge-alerting">
              ${escapeHtml(winner)}
            </span>
          </div>
          <div class="q-instructions">${escapeHtml(instructions)}</div>
          <div style="display: flex; flex-direction: column; gap: 0.45rem;">
            ${rowsHtml}
          </div>
          <div class="q-footer">
            <span>Confidence: <strong>${confPct}%</strong></span>
            <span class="badge ${isLowConf ? 'badge-medium' : 'badge-open'}">
              ${isLowConf ? 'Below Threshold' : 'Confident'}
            </span>
          </div>
        </div>
      `;
    }

    function renderScoreCard(qKey, ans, meta, threshold) {
      const score = Number(ans.score ?? 0);
      const conf = Number(ans.confidence ?? 0);
      const confPct = (conf * 100).toFixed(1);
      const isLowConf = conf < threshold;
      const instructions = (meta && meta.instructions) || formatKeyLabel(qKey);
      const legend = ans.legend || {};
      const probs = ans.probabilities || {};

      const levelKeys = Object.keys(legend).length
        ? Object.keys(legend).sort((a, b) => Number(a) - Number(b))
        : Object.keys(probs).sort((a, b) => Number(a) - Number(b));
      const maxLevel = levelKeys.length > 0 ? Number(levelKeys[levelKeys.length - 1]) : 3;

      const levelsHtml = levelKeys.map(lvlKey => {
        const pVal = Number(probs[lvlKey] ?? 0);
        const pct = (pVal * 100).toFixed(1);
        const desc = legend[lvlKey] || `Level ${lvlKey}`;
        return `
          <div class="prob-row">
            <div class="prob-label-line">
              <span class="prob-opt-name" style="font-size: 0.7rem;"><strong>[${escapeHtml(lvlKey)}]</strong> ${escapeHtml(desc)}</span>
              <span class="prob-pct">${pct}%</span>
            </div>
            <div class="bar-track">
              <div class="bar-fill" style="width: ${Math.max(1.5, pVal * 100)}%; background: var(--soar-accent);"></div>
            </div>
          </div>
        `;
      }).join('');

      return `
        <div class="q-card ${isLowConf ? 'low-confidence' : ''}">
          <div class="q-header">
            <div class="q-key-wrap">
              <span class="q-key">${escapeHtml(qKey)}</span>
              <span class="badge badge-low" style="width: fit-content;">Rubric Score</span>
            </div>
            <span class="badge badge-alerting">
              Score: ${score.toFixed(2)} / ${maxLevel}
            </span>
          </div>
          <div class="q-instructions">${escapeHtml(instructions)}</div>
          <div style="display: flex; flex-direction: column; gap: 0.45rem;">
            ${levelsHtml}
          </div>
          <div class="q-footer">
            <span>Confidence: <strong>${confPct}%</strong></span>
            <span class="badge ${isLowConf ? 'badge-medium' : 'badge-open'}">
              ${isLowConf ? 'Below Threshold' : 'Confident'}
            </span>
          </div>
        </div>
      `;
    }

    function renderCards() {
      const container = document.getElementById('questions-container');
      if (!container || !activePayload) return;

      const answers = activePayload.answers || {};
      const metaMap = activePayload.questions_metadata || {};
      const threshold = Number(activePayload.confidence_threshold ?? 0.8);
      const entries = Object.entries(answers);

      const filtered = entries.filter(([qKey, ans]) => {
        const qType = ans.type || (metaMap[qKey] && metaMap[qKey].type) || 'noul';
        const conf = Number(ans.confidence ?? 0);
        if (activeFilter === 'all') return true;
        if (activeFilter === 'low_conf') return conf < threshold;
        return qType === activeFilter;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-banner" style="grid-column: 1 / -1;">
            No decision questions match the selected filter criteria.
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(([qKey, ans]) => {
        const meta = metaMap[qKey] || {};
        const qType = ans.type || meta.type || 'noul';
        if (qType === 'choice') return renderChoiceCard(qKey, ans, meta, threshold);
        if (qType === 'score') return renderScoreCard(qKey, ans, meta, threshold);
        return renderNoulCard(qKey, ans, meta, threshold);
      }).join('');
    }

    function renderWidget() {
      let rawContent = null;
      try {
        rawContent = [{stepInstanceName}.JsonResult];
      } catch (e) {
        rawContent = null;
      }
      if (!rawContent) {
        try {
          const rawEl = document.getElementById('raw-data');
          rawContent = rawEl ? rawEl.textContent : null;
        } catch (e) {}
      }

      activePayload = extractPayload(rawContent);
      const container = document.getElementById('content');

      if (!activePayload || !activePayload.answers) {
        container.innerHTML = `
          <div class="widget-header-card">
            <div class="header-left">
              <div class="header-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9 11l3 3L22 4"></path>
                  <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                </svg>
              </div>
              <div class="header-title-group">
                <span class="header-title">SOC Decision Preset</span>
                <span class="header-subtitle">Awaiting action execution or case data context...</span>
              </div>
            </div>
          </div>
        `;
        return;
      }

      const presetTitle = escapeHtml(activePayload.preset_name || 'SOC Decision Evaluation');
      const caseId = activePayload.case_id ? `Case #${escapeHtml(activePayload.case_id)} &bull; ` : '';
      const threshold = Number(activePayload.confidence_threshold ?? 0.8);
      const threshPct = (threshold * 100).toFixed(0);
      const allConfident = Boolean(activePayload.all_confident);

      const answers = activePayload.answers || {};
      const metaMap = activePayload.questions_metadata || {};
      const entries = Object.entries(answers);
      const qCount = entries.length;

      let noulCount = 0;
      let choiceCount = 0;
      let scoreCount = 0;
      let lowConfCount = 0;

      entries.forEach(([qKey, ans]) => {
        const qType = ans.type || (metaMap[qKey] && metaMap[qKey].type) || 'noul';
        if (qType === 'choice') choiceCount++;
        else if (qType === 'score') scoreCount++;
        else noulCount++;

        if (Number(ans.confidence ?? 0) < threshold) {
          lowConfCount++;
        }
      });

      const confidentCount = qCount - lowConfCount;
      const latency = Number(activePayload.latency_ms ?? 0);

      const headerBadge = allConfident
        ? `<span class="badge badge-open">Auto-Action Ready (&ge; ${threshPct}%)</span>`
        : `<span class="badge badge-medium">Human Escalation Recommended (&lt; ${threshPct}%)</span>`;

      container.innerHTML = `
        <div class="widget-header-card">
          <div class="header-left">
            <div class="header-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 11l3 3L22 4"></path>
                <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
              </svg>
            </div>
            <div class="header-title-group">
              <span class="header-title">${presetTitle}</span>
              <span class="header-subtitle">${caseId}Confidence Gate Threshold: ${threshPct}%</span>
            </div>
          </div>
          <div>${headerBadge}</div>
        </div>

        <div class="metrics-grid">
          <div class="metric-card">
            <span class="metric-label">Questions Evaluated</span>
            <span class="metric-value" style="color: var(--soar-accent);">${qCount}</span>
          </div>
          <div class="metric-card">
            <span class="metric-label">Confident (&ge; ${threshPct}%)</span>
            <span class="metric-value" style="color: ${confidentCount === qCount ? 'var(--verdict-benign-text)' : 'var(--soar-text-primary)'};">${confidentCount} / ${qCount}</span>
          </div>
          <div class="metric-card">
            <span class="metric-label">Low Confidence</span>
            <span class="metric-value" style="color: ${lowConfCount > 0 ? 'var(--sev-medium-text)' : 'var(--soar-text-primary)'};">${lowConfCount}</span>
          </div>
          <div class="metric-card">
            <span class="metric-label">Evaluation Latency</span>
            <span class="metric-value">${latency} ms</span>
          </div>
        </div>

        <div class="section-title">
          <span>Decision Criteria (${qCount})</span>
        </div>

        <div class="filter-toolbar">
          <div class="filter-tabs">
            <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">All (${qCount})</button>
            <button class="filter-btn" data-filter="noul" onclick="setFilter('noul')">Yes / No (${noulCount})</button>
            <button class="filter-btn" data-filter="choice" onclick="setFilter('choice')">Routing (${choiceCount})</button>
            <button class="filter-btn" data-filter="score" onclick="setFilter('score')">Rubric (${scoreCount})</button>
            <button class="filter-btn" data-filter="low_conf" onclick="setFilter('low_conf')">Low Confidence (${lowConfCount})</button>
          </div>
        </div>

        <div id="questions-container" class="questions-grid"></div>
      `;

      renderCards();
    }

    renderWidget();
  </script>
</body>
</html>
