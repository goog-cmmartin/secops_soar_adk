creator: Christopher Martin
description: Evaluates custom structured binary (noul), single-select routing (choice), and rubric rating (score) questions against text, JSON, SOAR Alert context, or multimodal attachments using Gemini Decision 1 (gemini-decision-1) with zero output tokens.
dynamic_results_metadata:
- result_example_path: resources/evaluate_decisions_JsonResult_example.json
  result_name: JsonResult
  show_result: true
integration_identifier: GoogleDecisions
is_async: false
name: Evaluate Decisions
parameters:
- default_value: ''
  description: Text or JSON payload to evaluate against the decision questions.
  is_mandatory: false
  name: Input Text or JSON
  type: string
- default_value: true
  description: Automatically serialize and include the active SOAR Alert metadata, security events, and entities in the shared input context.
  is_mandatory: false
  name: Include Alert Context
  type: boolean
- default_value: '{"is_malicious": {"type": "noul", "instructions": "Does this telemetry indicate likely malicious activity?"}}'
  description: JSON object mapping question keys ([A-Za-z0-9_-]{1,64}) to noul (yes/no), choice (single-select options), or score (ordered rubric levels) questions.
  is_mandatory: true
  name: Questions JSON
  type: string
- default_value: ''
  description: Optional inline base64 data or HTTPS URI for multimodal inspection (e.g., phishing screenshot, PDF document, audio, or video).
  is_mandatory: false
  name: Media Input (Base64 or HTTPS URI)
  type: string
- default_value: ''
  description: Optional MIME type when Media Input is provided (e.g., image/png, image/jpeg, application/pdf, audio/mp3, video/mp4).
  is_mandatory: false
  name: Media MIME Type
  type: string
- default_value: '0.80'
  description: Minimum calibrated confidence threshold (0.0 to 1.0) required for all_confident=true before automated playbook branching.
  is_mandatory: false
  name: Confidence Threshold
  type: string
- default_value: '60000'
  description: Maximum character budget for the shared input context before smart JSON telemetry compaction and head/tail truncation are applied to stay safely within the 262,144 token limit.
  is_mandatory: false
  name: Max Input Characters
  type: string
