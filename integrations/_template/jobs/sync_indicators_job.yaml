name: "Sync Indicators Job"
description: "Periodically synchronizes indicators and threat intelligence feeds on a schedule."
parameters:
  - name: "Environment"
    description: "The SOAR environment to run against."
    type: string
    is_mandatory: false
    default_value: "Default"
  - name: "Batch Size"
    description: "Maximum number of records to process per run."
    type: integer
    is_mandatory: false
    default_value: 100
  - name: "API Root"
    description: "The base URL for the target service endpoint."
    type: string
    is_mandatory: true
    default_value: "https://api.example.com"
  - name: "API Key"
    description: "Authentication API Key."
    type: string
    is_mandatory: true
    is_password: true
    default_value: ""
  - name: "Verify SSL"
    description: "Verify SSL certificates."
    type: boolean
    is_mandatory: false
    default_value: true
