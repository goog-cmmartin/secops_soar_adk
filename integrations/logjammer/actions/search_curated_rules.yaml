creator: admin
description: Fast search and inspection across 5,700+ Google SecOps curated detection rules bundled in LogJammer by keyword, MITRE technique, tactic, or category.
dynamic_results_metadata:
- result_example_path: resources/search_curated_rules_JsonResult_example.json
  result_name: JsonResult
  show_result: true
integration_identifier: LogJammer
is_async: false
name: Search Curated Rules
parameters:
- default_value: ''
  description: Keyword to search in rule name, logic, or metadata.
  is_mandatory: false
  name: Search Query
  type: string
- default_value: ''
  description: MITRE ATT&CK Technique ID (e.g. T1562, T1059.001).
  is_mandatory: false
  name: MITRE Technique
  type: string
- default_value: ''
  description: MITRE ATT&CK Tactic ID (e.g. TA0005, TA0006).
  is_mandatory: false
  name: MITRE Tactic
  type: string
- default_value: ''
  description: Rule category filter (e.g. cloud_threats, windows_threats, applied_threat_intelligence).
  is_mandatory: false
  name: Category
  type: string
- default_value: '20'
  description: Maximum number of rules to return.
  is_mandatory: false
  name: Limit
  type: string
