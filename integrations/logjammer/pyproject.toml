[project]
name = "soar-integration-logjammer"
version = "2.9"
description = "LogJammer Integration for Google SecOps SOAR"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-auth>=2.20.0",
    "google-genai>=0.1.0",
    "pydantic>=2.0.0",
    "requests>=2.28.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
