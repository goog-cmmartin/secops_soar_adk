<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="lj-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA4335" />
      <stop offset="50%" stop-color="#9C27B0" />
      <stop offset="100%" stop-color="#4285F4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <circle cx="50" cy="50" r="46" fill="#1e1e2d" stroke="url(#lj-grad)" stroke-width="4"/>
  <!-- Sound/Log Wave bars -->
  <rect x="22" y="44" width="6" height="12" rx="3" fill="#EA4335" />
  <rect x="32" y="32" width="6" height="36" rx="3" fill="#FBBC04" />
  <rect x="42" y="20" width="6" height="60" rx="3" fill="#34A853" />
  <rect x="52" y="28" width="6" height="44" rx="3" fill="#4285F4" />
  <rect x="62" y="38" width="6" height="24" rx="3" fill="#A142F4" />
  <rect x="72" y="46" width="6" height="8" rx="3" fill="#EA4335" />
  <!-- Threat radar crosshair -->
  <circle cx="50" cy="50" r="28" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-dasharray="3,3" stroke-width="1.5" />
</svg>
