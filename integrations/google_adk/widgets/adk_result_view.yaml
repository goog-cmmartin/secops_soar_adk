action_identifier: Run ADK Agent
condition_group:
  conditions:
  - field_name: '[{stepInstanceName}.JsonResult]'
    match_type: not_contains
    value: '{stepInstanceName}'
  logical_operator: and
data_definition:
  html_height: 500
  safe_rendering: false
  type: html
  widget_definition_scope: both
default_size: half_width
description: Renders Google ADK agent thought trace, markdown analysis report, and
  findings with automatic light/dark theme adaptation.
scope: alert
title: Google ADK Agent Analysis
type: html
