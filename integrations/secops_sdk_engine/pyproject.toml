[project]
name = "soar-integration-secops-sdk-engine"
version = "5.8"
description = "SecOps SDK Engine Integration for Google SecOps SOAR"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-auth>=2.20.0",
    "pydantic>=2.0.0",
    "requests>=2.28.0",
    "pyyaml>=6.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
