<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="sdk-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4" />
      <stop offset="50%" stop-color="#00ACC1" />
      <stop offset="100%" stop-color="#34A853" />
    </linearGradient>
    <linearGradient id="shield-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="shield-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>

  <!-- Outer dark circular badge -->
  <circle cx="50" cy="50" r="46" fill="#0F172A" stroke="url(#sdk-ring)" stroke-width="4" />

  <!-- Subtle outer telemetry orbit ring -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#334155" stroke-dasharray="4,4" stroke-width="1.5" />

  <!-- SecOps Shield Core -->
  <path d="M50 18 L76 29 V49 C76 66.5 64.8 80.2 50 85 C35.2 80.2 24 66.5 24 49 V29 Z"
        fill="url(#shield-fill)" stroke="url(#shield-stroke)" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Correlation Graph Edges inside Shield -->
  <line x1="50" y1="34" x2="36" y2="50" stroke="#60A5FA" stroke-width="2.2" stroke-linecap="round" />
  <line x1="50" y1="34" x2="64" y2="50" stroke="#34D399" stroke-width="2.2" stroke-linecap="round" />
  <line x1="36" y1="50" x2="50" y2="66" stroke="#FBBF24" stroke-width="2.2" stroke-linecap="round" />
  <line x1="64" y1="50" x2="50" y2="66" stroke="#F87171" stroke-width="2.2" stroke-linecap="round" />
  <line x1="36" y1="50" x2="64" y2="50" stroke="#94A3B8" stroke-width="1.8" stroke-dasharray="2.5,2.5" />
  <line x1="50" y1="34" x2="50" y2="66" stroke="#94A3B8" stroke-width="1.8" stroke-dasharray="2.5,2.5" />

  <!-- Central Correlation Engine Hub -->
  <circle cx="50" cy="50" r="6.5" fill="#0F172A" stroke="#38BDF8" stroke-width="2.5" />
  <circle cx="50" cy="50" r="2.8" fill="#38BDF8" />

  <!-- Telemetry & Detection Nodes (Google 4-Color Palette) -->
  <!-- Top Node (SIEM / UDM) -->
  <circle cx="50" cy="34" r="4.5" fill="#4285F4" stroke="#0F172A" stroke-width="1.5" />
  <!-- Right Node (Entity / Context) -->
  <circle cx="64" cy="50" r="4.5" fill="#34A853" stroke="#0F172A" stroke-width="1.5" />
  <!-- Left Node (Case / SOAR) -->
  <circle cx="36" cy="50" r="4.5" fill="#FBBC04" stroke="#0F172A" stroke-width="1.5" />
  <!-- Bottom Node (Silent Detection Alert) -->
  <circle cx="50" cy="66" r="4.5" fill="#EA4335" stroke="#0F172A" stroke-width="1.5" />
</svg>
