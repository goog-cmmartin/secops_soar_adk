<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autonomous Detection Tuning - SecOps SOAR Widget</title>
  <style>
    /* ==========================================================================
       Google SecOps SOAR Theme Variables (Self-contained, no CDN dependencies)
       Matches SecOpsSDKEngine & GoogleADK Light/Dark Adaptive Widget Suite
       ========================================================================== */
    :root,
    [data-theme="light"],
    body.light {
      --soar-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Rubik", Helvetica, Arial, sans-serif;
      --soar-font-mono: ui-monospace, SFMono-Regular, "Fira Code", Menlo, Monaco, Consolas, monospace;

      --soar-bg-page: #ffffff;
      --soar-bg-card: #ffffff;
      --soar-bg-subtle: rgba(0, 0, 0, 0.04);
      --soar-border: #e5e7eb;
      --soar-border-strong: #d1d5db;
      --soar-text-primary: #111827;
      --soar-text-secondary: #4b5563;
      --soar-text-muted: #6b7280;
      --soar-accent: #2563eb;
      --soar-accent-hover: #1d4ed8;
      --soar-accent-subtle: rgba(37, 99, 235, 0.1);

      /* Verdicts */
      --verdict-malicious-bg: #fee2e2;
      --verdict-malicious-text: #dc2626;
      --verdict-malicious-border: #fca5a5;

      --verdict-benign-bg: #ecfdf5;
      --verdict-benign-text: #059669;
      --verdict-benign-border: #a7f3d0;

      /* Severities */
      --sev-critical-bg: #fef2f2;
      --sev-critical-text: #dc2626;
      --sev-critical-border: #fca5a5;
      --sev-high-bg: #fff7ed;
      --sev-high-text: #ea580c;
      --sev-high-border: #fdba74;
      --sev-medium-bg: #fffbeb;
      --sev-medium-text: #d97706;
      --sev-medium-border: #fde68a;
      --sev-low-bg: #f3f4f6;
      --sev-low-text: #6b7280;
      --sev-low-border: #d1d5db;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --soar-bg-page: #161626;
        --soar-bg-card: #161626;
        --soar-bg-subtle: rgba(255, 255, 255, 0.06);
        --soar-border: #293140;
        --soar-border-strong: #384357;
        --soar-text-primary: #f3f4f6;
        --soar-text-secondary: #9ca3af;
        --soar-text-muted: #6b7280;
        --soar-accent: #3b82f6;
        --soar-accent-hover: #60a5fa;
        --soar-accent-subtle: rgba(59, 130, 246, 0.16);

        --verdict-malicious-bg: #3b191d;
        --verdict-malicious-text: #ff8589;
        --verdict-malicious-border: #8c1d28;

        --verdict-benign-bg: #132d21;
        --verdict-benign-text: #6ee7b7;
        --verdict-benign-border: #065f46;

        --sev-critical-bg: #450a0a;
        --sev-critical-text: #f87171;
        --sev-critical-border: #7f1d1d;
        --sev-high-bg: #431407;
        --sev-high-text: #fb923c;
        --sev-high-border: #7c2d12;
        --sev-medium-bg: #451a03;
        --sev-medium-text: #fbbf24;
        --sev-medium-border: #78350f;
        --sev-low-bg: #1f2937;
        --sev-low-text: #9ca3af;
        --sev-low-border: #374151;
      }
    }

    [data-theme="dark"], body.dark {
      --soar-bg-page: #161626;
      --soar-bg-card: #161626;
      --soar-bg-subtle: rgba(255, 255, 255, 0.06);
      --soar-border: #293140;
      --soar-border-strong: #384357;
      --soar-text-primary: #f3f4f6;
      --soar-text-secondary: #9ca3af;
      --soar-text-muted: #6b7280;
      --soar-accent: #3b82f6;
      --soar-accent-hover: #60a5fa;
      --soar-accent-subtle: rgba(59, 130, 246, 0.16);

      --verdict-malicious-bg: #3b191d;
      --verdict-malicious-text: #ff8589;
      --verdict-malicious-border: #8c1d28;

      --verdict-benign-bg: #132d21;
      --verdict-benign-text: #6ee7b7;
      --verdict-benign-border: #065f46;

      --sev-critical-bg: #450a0a;
      --sev-critical-text: #f87171;
      --sev-critical-border: #7f1d1d;
      --sev-high-bg: #431407;
      --sev-high-text: #fb923c;
      --sev-high-border: #7c2d12;
      --sev-medium-bg: #451a03;
      --sev-medium-text: #fbbf24;
      --sev-medium-border: #78350f;
      --sev-low-bg: #1f2937;
      --sev-low-text: #9ca3af;
      --sev-low-border: #374151;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background-color: var(--soar-bg-page, #ffffff);
      background: var(--soar-bg-page, #ffffff);
      font-family: var(--soar-font);
      color: var(--soar-text-primary);
      padding: 0.75rem;
      line-height: 1.5;
      font-size: 0.8125rem;
      width: 100%;
      height: auto;
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: var(--soar-bg-page);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--soar-border-strong);
      border-radius: 3px;
    }

    .widget-container {
      width: 100%;
      max-width: 100%;
      margin: 0;
      background: transparent;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    /* Top Summary Header */
    .widget-header-card {
      background: var(--soar-bg-card);
      border: 1px solid var(--soar-border);
      border-radius: 8px;
      padding: 0.95rem 1.2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.85rem;
      flex-wrap: wrap;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .header-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: var(--soar-accent-subtle);
      border: 1px solid var(--soar-accent);
      color: var(--soar-accent);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .header-icon svg {
      width: 20px;
      height: 20px;
    }
    .header-title-group {
      display: flex;
      flex-direction: column;
    }
    .header-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--soar-text-primary);
    }
    .header-subtitle {
      font-size: 0.74rem;
      color: var(--soar-text-muted);
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    /* Status & Severity Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.18rem 0.55rem;
      border-radius: 4px;
      font-size: 0.6875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      white-space: nowrap;
      border: 1px solid transparent;
    }
    .badge-verified {
      background: var(--verdict-benign-bg);
      color: var(--verdict-benign-text);
      border-color: var(--verdict-benign-border);
    }
    .badge-proposed {
      background: var(--soar-accent-subtle);
      color: var(--soar-accent);
      border-color: var(--soar-accent);
    }
    .badge-warn {
      background: var(--sev-medium-bg);
      color: var(--sev-medium-text);
      border-color: var(--sev-medium-border);
    }
    .badge-muted {
      background: var(--soar-bg-subtle);
      color: var(--soar-text-secondary);
      border-color: var(--soar-border);
    }

    /* Interactive Tag Action Buttons */
    .btn-tag-action {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.3rem 0.65rem;
      border-radius: 5px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: var(--soar-font);
      white-space: nowrap;
    }
    .btn-tag-approve {
      background: var(--verdict-benign-bg);
      color: var(--verdict-benign-text);
      border: 1px solid var(--verdict-benign-border);
    }
    .btn-tag-approve:hover {
      filter: brightness(1.08);
      box-shadow: 0 0 0 1px var(--verdict-benign-text);
    }
    .btn-tag-candidate {
      background: var(--soar-accent-subtle);
      color: var(--soar-accent);
      border: 1px solid var(--soar-accent);
    }
    .btn-tag-candidate:hover {
      background: var(--soar-accent);
      color: #ffffff;
    }
    .btn-tag-secondary {
      background: var(--soar-bg-subtle);
      color: var(--soar-text-secondary);
      border: 1px solid var(--soar-border-strong);
    }
    .btn-tag-secondary:hover {
      border-color: var(--soar-accent);
      color: var(--soar-accent);
    }

    /* Tag Feedback Toast Banner */
    .tag-toast-banner {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.6rem 1rem;
      border-radius: 6px;
      font-size: 0.75rem;
      background: var(--soar-accent-subtle);
      border: 1px solid var(--soar-accent);
      color: var(--soar-text-primary);
    }

    /* Metrics Grid */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(125px, 1fr));
      gap: 0.7rem;
    }
    .metric-card {
      background: var(--soar-bg-card);
      border: 1px solid var(--soar-border);
      border-radius: 8px;
      padding: 0.7rem 0.95rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }
    .metric-label {
      font-size: 0.6875rem;
      color: var(--soar-text-muted);
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    .metric-value {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--soar-text-primary);
      line-height: 1.2;
    }

    /* Proposal Card */
    .proposal-card {
      background: var(--soar-bg-card);
      border: 1px solid var(--soar-border);
      border-radius: 8px;
      padding: 0.95rem 1.15rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .proposal-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
      padding-bottom: 0.55rem;
      border-bottom: 1px solid var(--soar-border);
    }
    .rule-title {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--soar-text-primary);
    }
    .rule-id {
      font-family: var(--soar-font-mono);
      font-size: 0.72rem;
      color: var(--soar-text-muted);
      margin-top: 0.1rem;
    }

    .tuple-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
    }
    .tuple-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: var(--soar-bg-subtle);
      border: 1px solid var(--soar-border-strong);
      border-radius: 5px;
      padding: 0.2rem 0.55rem;
      font-size: 0.73rem;
    }
    .tuple-key {
      font-weight: 600;
      color: var(--soar-text-muted);
      text-transform: uppercase;
      font-size: 0.65rem;
      letter-spacing: 0.02em;
    }
    .tuple-val {
      font-family: var(--soar-font-mono);
      color: var(--soar-accent);
      font-weight: 600;
    }

    .blast-bar-wrap {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    .blast-bar-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.73rem;
      color: var(--soar-text-secondary);
      flex-wrap: wrap;
      gap: 0.4rem;
    }
    .blast-track {
      width: 100%;
      height: 8px;
      background: var(--soar-bg-subtle);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--soar-border);
    }
    .blast-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--soar-accent), #10b981);
      border-radius: 999px;
    }

    .code-box {
      position: relative;
      background: var(--soar-bg-subtle);
      border: 1px solid var(--soar-border);
      border-radius: 6px;
      padding: 0.65rem 4.2rem 0.65rem 0.8rem;
      font-family: var(--soar-font-mono);
      font-size: 0.73rem;
      color: var(--soar-text-primary);
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.45;
    }
    .copy-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      background: var(--soar-bg-card);
      border: 1px solid var(--soar-border-strong);
      color: var(--soar-text-secondary);
      border-radius: 4px;
      padding: 0.18rem 0.5rem;
      font-size: 0.68rem;
      font-weight: 600;
      cursor: pointer;
    }
    .copy-btn:hover {
      border-color: var(--soar-accent);
      color: var(--soar-accent);
    }

    details {
      background: var(--soar-bg-subtle);
      border: 1px solid var(--soar-border);
      border-radius: 6px;
      padding: 0.5rem 0.75rem;
    }
    summary {
      cursor: pointer;
      font-weight: 600;
      font-size: 0.74rem;
      color: var(--soar-text-secondary);
      outline: none;
      user-select: none;
    }
    summary:hover {
      color: var(--soar-accent);
    }
    .diff-pre {
      margin-top: 0.5rem;
      padding-top: 0.5rem;
      border-top: 1px solid var(--soar-border);
      font-family: var(--soar-font-mono);
      font-size: 0.71rem;
      white-space: pre-wrap;
      overflow-x: auto;
      color: var(--soar-text-secondary);
      line-height: 1.4;
    }

    .card-footer {
      padding: 0.6rem 1.15rem;
      background: var(--soar-bg-card);
      border: 1px solid var(--soar-border);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.72rem;
      color: var(--soar-text-muted);
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .ai-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-weight: 600;
      color: var(--soar-accent);
    }
  </style>
</head>
<body>
  <div id="content" class="widget-container"></div>

  <script>
    // =========================================================================
    // Google SecOps SOAR Theme Synchronization Bridge
    // =========================================================================
    const SOAR_PALETTES = {
      dark: {
        theme: 'dark',
        '--soar-bg-page': '#161626',
        '--soar-bg-card': '#161626',
        '--soar-border': '#293140',
        '--soar-border-strong': '#384357',
        '--soar-text-primary': '#f3f4f6',
        '--soar-text-secondary': '#9ca3af',
        '--soar-text-muted': '#6b7280'
      },
      light: {
        theme: 'light',
        '--soar-bg-page': '#ffffff',
        '--soar-bg-card': '#ffffff',
        '--soar-border': '#e5e7eb',
        '--soar-border-strong': '#d1d5db',
        '--soar-text-primary': '#111827',
        '--soar-text-secondary': '#4b5563',
        '--soar-text-muted': '#6b7280'
      }
    };

    function isColorDark(color) {
      if (!color) return false;
      let r = 255, g = 255, b = 255;
      color = String(color).trim();
      if (color.startsWith('#')) {
        let hex = color.replace('#', '');
        if (hex.length === 3) {
          hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2];
        }
        if (hex.length >= 6) {
          r = parseInt(hex.substring(0, 2), 16);
          g = parseInt(hex.substring(2, 4), 16);
          b = parseInt(hex.substring(4, 6), 16);
        }
      } else if (color.startsWith('rgb')) {
        const parts = color.match(/\d+/g);
        if (parts && parts.length >= 3) {
          r = parseInt(parts[0], 10);
          g = parseInt(parts[1], 10);
          b = parseInt(parts[2], 10);
        }
      }
      const luminance = (0.299 * r + 0.587 * g + 0.114 * b);
      return luminance < 140;
    }

    function applySoarTheme(themeKeyOrObj) {
      const mode = typeof themeKeyOrObj === 'string' ? themeKeyOrObj : (themeKeyOrObj.theme || 'light');
      document.documentElement.setAttribute('data-theme', mode);
      document.body.className = mode;

      const palette = typeof themeKeyOrObj === 'object' ? themeKeyOrObj : (SOAR_PALETTES[mode] || SOAR_PALETTES.light);
      for (const [key, value] of Object.entries(palette)) {
        if (key.startsWith('--')) {
          document.documentElement.style.setProperty(key, value);
          document.body.style.setProperty(key, value);
        }
      }
      document.body.style.backgroundColor = palette['--soar-bg-page'] || (mode === 'dark' ? '#161626' : '#ffffff');
    }

    window.addEventListener('message', evt => {
      if (evt && evt.data && evt.data.background) {
        const isDark = isColorDark(evt.data.background);
        applySoarTheme(isDark ? SOAR_PALETTES.dark : SOAR_PALETTES.light);
      }
    });

    onmessage = evt => {
      if (evt && evt.data && evt.data.background) {
        const isDark = isColorDark(evt.data.background);
        applySoarTheme(isDark ? SOAR_PALETTES.dark : SOAR_PALETTES.light);
      }
    };

    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      applySoarTheme(SOAR_PALETTES.dark);
    } else {
      applySoarTheme(SOAR_PALETTES.light);
    }

    // =========================================================================
    // Payload Extraction & Interactive SOAR Case Tag Dispatcher
    // =========================================================================
    function extractPayload(input) {
      if (!input) return null;
      let data = input;
      if (typeof data === "string") {
        const trimmed = data.trim();
        if (trimmed.startsWith("[") && trimmed.includes(".JsonResult")) return null;
        try { data = JSON.parse(trimmed); } catch (e) {}
      }
      while (Array.isArray(data) && data.length > 0) data = data[0];
      if (typeof data === "string") {
        try { data = JSON.parse(data.trim()); } catch (e) {}
      }
      if (Array.isArray(data) && data.length > 0) data = data[0];
      return data;
    }

    function escapeHtml(text) {
      if (text === null || text === undefined) return "";
      const div = document.createElement("div");
      div.innerText = String(text);
      return div.innerHTML;
    }

    function copyText(text, btn) {
      navigator.clipboard.writeText(String(text || "")).then(() => {
        if (btn) {
          const orig = btn.innerText;
          btn.innerText = "Copied!";
          setTimeout(() => { btn.innerText = orig; }, 1400);
        }
      });
    }

    function resolveCurrentCaseId(rawDataObj) {
      if (rawDataObj && rawDataObj.case_id && !String(rawDataObj.case_id).includes("[Case.Id]")) {
        return String(rawDataObj.case_id).trim();
      }
      const placeholderCaseId = "[Case.Id]";
      if (placeholderCaseId && !placeholderCaseId.includes("Case.Id")) {
        return placeholderCaseId.trim();
      }
      try {
        const href = (window.top && window.top.location && window.top.location.href) || document.referrer || "";
        const m = href.match(/\/cases\/(\d+)/i);
        if (m && m[1]) return m[1];
      } catch (e) {}
      return "";
    }

    function showTagToast(message, isSuccess) {
      const banner = document.getElementById("tag-toast-banner");
      const textEl = document.getElementById("tag-toast-text");
      if (!banner || !textEl) return;
      banner.style.display = "flex";
      banner.style.borderColor = isSuccess ? "var(--verdict-benign-border)" : "var(--soar-accent)";
      banner.style.background = isSuccess ? "var(--verdict-benign-bg)" : "var(--soar-accent-subtle)";
      banner.style.color = isSuccess ? "var(--verdict-benign-text)" : "var(--soar-text-primary)";
      textEl.innerHTML = message;
    }

    async function addSoarCaseTag(tagName, btnEl) {
      const caseId = resolveCurrentCaseId(rawData);
      const origHtml = btnEl ? btnEl.innerHTML : "";
      if (btnEl) {
        btnEl.disabled = true;
        btnEl.innerHTML = `<span>⏳ Adding ${escapeHtml(tagName)}...</span>`;
      }

      // Always copy tag to clipboard as an instant helper
      try { await navigator.clipboard.writeText(tagName); } catch (e) {}

      let addedViaApi = false;
      if (caseId) {
        const endpoints = [
          {
            url: `/api/external/v1/cases/AddCaseTag?format=camel`,
            body: { caseId: Number(caseId) || caseId, tag: tagName, tagName: tagName }
          },
          {
            url: `/api/external/v1/cases/AddTag?format=camel`,
            body: { caseId: Number(caseId) || caseId, tag: tagName, tagName: tagName }
          }
        ];
        if (rawData && rawData.project_id && rawData.customer_id) {
          const loc = rawData.region || "us";
          endpoints.push({
            url: `/v1alpha/projects/${encodeURIComponent(rawData.project_id)}/locations/${encodeURIComponent(loc)}/instances/${encodeURIComponent(rawData.customer_id)}/cases/${encodeURIComponent(caseId)}:addTag`,
            body: { tag: tagName }
          });
        }

        for (const ep of endpoints) {
          try {
            const resp = await fetch(ep.url, {
              method: "POST",
              credentials: "include",
              headers: { "Content-Type": "application/json", "Accept": "application/json" },
              body: JSON.stringify(ep.body)
            });
            if (resp && resp.ok) {
              addedViaApi = true;
              break;
            }
          } catch (err) {}
        }
      }

      if (addedViaApi) {
        if (btnEl) {
          btnEl.innerHTML = `<span>✓ Tagged ${escapeHtml(tagName)}</span>`;
        }
        showTagToast(
          `<strong>✓ Case #${escapeHtml(caseId)} tagged with <code>${escapeHtml(tagName)}</code>!</strong> The <em>Case Autonomous False Positive Tuning</em> playbook has been queued.`,
          true
        );
      } else {
        if (btnEl) {
          btnEl.innerHTML = `<span>📋 Copied ${escapeHtml(tagName)}</span>`;
          setTimeout(() => {
            btnEl.disabled = false;
            btnEl.innerHTML = origHtml;
          }, 2600);
        }
        showTagToast(
          `<strong>📋 Tag <code>${escapeHtml(tagName)}</code> copied to clipboard!</strong> Click the <strong>+</strong> Tag icon in the Case #${escapeHtml(caseId || "")} header above and paste <code>${escapeHtml(tagName)}</code> to trigger the playbook.`,
          false
        );
      }
    }

    let rawData = null;
    try {
      rawData = [{stepInstanceName}.JsonResult];
    } catch (e) {
      rawData = null;
    }
    rawData = extractPayload(rawData);

    function renderWidget() {
      const container = document.getElementById("content");
      const caseId = resolveCurrentCaseId(rawData);

      if (!rawData || typeof rawData !== "object") {
        container.innerHTML = `
          <div class="widget-header-card">
            <div class="header-left">
              <div class="header-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M12 20h9"></path>
                  <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                </svg>
              </div>
              <div class="header-title-group">
                <span class="header-title">Autonomous Detection Tuning &amp; FP Reduction</span>
                <span class="header-subtitle">Awaiting proposal synthesis for Case #${escapeHtml(caseId || "N/A")}</span>
              </div>
            </div>
            <div class="header-actions">
              <button class="btn-tag-action btn-tag-candidate" onclick="addSoarCaseTag('Tune:Candidate', this)">
                <span>🛠️ Propose Tuning (Tag Tune:Candidate)</span>
              </button>
            </div>
          </div>
          <div id="tag-toast-banner" class="tag-toast-banner"><span id="tag-toast-text"></span></div>
        `;
        return;
      }

      const proposals = Array.isArray(rawData.proposals) ? rawData.proposals : [];
      const count = rawData.proposals_count || proposals.length;
      const appliedCount = rawData.applied_count || (Array.isArray(rawData.applied_refinements) ? rawData.applied_refinements.length : proposals.filter(p => p.applied).length);
      const verifiedCount = proposals.filter(p => p.compiler_verified || p.safety_guardrail_passed).length;
      const avgBlast = proposals.length > 0
        ? (proposals.reduce((acc, p) => acc + (Number(p.noise_reduction_pct ?? p.blast_radius_reduction_pct) || 0), 0) / proposals.length).toFixed(1)
        : "0.0";
      const ttlStr = rawData.ttl_expires_date || (proposals.length > 0 && (proposals[0].ttl_expires_date || proposals[0].expires_at)
        ? String(proposals[0].ttl_expires_date || proposals[0].expires_at).substring(0, 10)
        : "30d TTL");
      const ledgerRowsCount = rawData.recorded_to_data_table_count ?? (Array.isArray(rawData.recorded_data_table_ids) ? rawData.recorded_data_table_ids.length : count);

      const statusBadge = appliedCount > 0
        ? `<span class="badge badge-verified">✓ Applied (${appliedCount})</span>`
        : `<span class="badge badge-proposed">⚡ Verified Proposals (${verifiedCount}/${count})</span>`;

      const proposalsHtml = proposals.map((p, idx) => {
        const tupleChips = Array.isArray(p.factors) && p.factors.length > 0
          ? p.factors.map(f => `
              <span class="tuple-chip">
                <span class="tuple-key">${escapeHtml(f.dimension || f.udm_field || "factor")}:</span>
                <span class="tuple-val">${escapeHtml(f.value || "")}</span>
              </span>
            `).join("")
          : Object.entries(p.exclusion_tuple || {}).map(([k, v]) => `
              <span class="tuple-chip">
                <span class="tuple-key">${escapeHtml(k)}:</span>
                <span class="tuple-val">${escapeHtml(v)}</span>
              </span>
            `).join("");

        const pct = Math.min(100, Math.max(0, Number(p.noise_reduction_pct ?? p.blast_radius_reduction_pct) || 0));
        const suppressedCnt = p.projected_suppressed_count ?? p.matched_fp_detections ?? 0;
        const totalCnt = p.unsuppressed_trigger_count ?? p.total_detections_lookback ?? 0;
        const tuningId = p.proposal_id || p.data_table_tuning_id || p.tuning_id || "";
        const verifyBadge = p.compiler_verified
          ? `<span class="badge badge-verified">✓ Compiler &amp; Dry-Run Verified</span>`
          : (p.safety_guardrail_passed ? `<span class="badge badge-proposed">✓ Multi-Factor Guardrail Verified</span>` : `<span class="badge badge-warn">⚠ Verification Note</span>`);

        const clauseText = p.yara_l_condition || p.udm_refinement_query || p.yaral_exclusion_clause || p.refinement_query || "";
        const diffHtml = p.unified_diff
          ? `<details><summary>View Unified YARA-L / Refinement Diff &amp; Governance Notes</summary><pre class="diff-pre">${escapeHtml(p.unified_diff)}</pre></details>`
          : "";

        return `
          <div class="proposal-card">
            <div class="proposal-header">
              <div>
                <div class="rule-title">${escapeHtml(p.rule_name || "Unknown Rule")}</div>
                <div class="rule-id">${escapeHtml(p.rule_id || "")} &bull; Type: ${escapeHtml(p.rule_type || "CUSTOM")} &bull; Tuning ID: ${escapeHtml(tuningId)}</div>
              </div>
              <div class="header-actions">${verifyBadge}</div>
            </div>

            <div class="tuple-grid">${tupleChips}</div>

            <div class="blast-bar-wrap">
              <div class="blast-bar-labels">
                <span>Retrospective Blast-Radius Reduction (${escapeHtml(rawData.lookback_days || 14)}d Window)</span>
                <strong>-${pct.toFixed(1)}% (${escapeHtml(suppressedCnt)} / ${escapeHtml(totalCnt)} detections suppressed)</strong>
              </div>
              <div class="blast-track">
                <div class="blast-fill" style="width: ${pct}%;"></div>
              </div>
            </div>

            <div class="code-box" id="clause-${idx}">${escapeHtml(clauseText)}<button class="copy-btn" onclick="copyText(document.getElementById('clause-${idx}').innerText.replace('Copy', '').trim(), this)">Copy</button></div>

            ${diffHtml}
          </div>
        `;
      }).join("");

      container.innerHTML = `
        <div class="widget-header-card">
          <div class="header-left">
            <div class="header-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 20h9"></path>
                <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
              </svg>
            </div>
            <div class="header-title-group">
              <span class="header-title">Autonomous Detection Tuning &amp; FP Reduction</span>
              <span class="header-subtitle">Case #${escapeHtml(caseId || rawData.case_id)} &bull; Ledger Table: ${escapeHtml(rawData.data_table_name || "asoc_detection_tuning")}</span>
            </div>
          </div>
          <div class="header-actions">
            ${statusBadge}
            <button class="btn-tag-action btn-tag-approve" onclick="addSoarCaseTag('Tune:Approve', this)" title="Adds Tune:Approve tag to auto-apply Curated Rule Findings Refinements and mark proposal approved">
              <span>✅ Approve &amp; Apply (Tag Tune:Approve)</span>
            </button>
            <button class="btn-tag-action btn-tag-secondary" onclick="addSoarCaseTag('Tune:Candidate', this)" title="Adds Tune:Candidate tag to re-run tuning synthesis">
              <span>🔄 Re-Run (Tag Tune:Candidate)</span>
            </button>
          </div>
        </div>

        <div id="tag-toast-banner" class="tag-toast-banner">
          <span id="tag-toast-text"></span>
        </div>

        <div class="metrics-grid">
          <div class="metric-card">
            <span class="metric-label">Proposals</span>
            <span class="metric-value" style="color: var(--soar-accent)">${count}</span>
          </div>
          <div class="metric-card">
            <span class="metric-label">Avg FP Reduction</span>
            <span class="metric-value" style="color: var(--verdict-benign-text)">-${avgBlast}%</span>
          </div>
          <div class="metric-card">
            <span class="metric-label">Verified</span>
            <span class="metric-value">${verifiedCount} / ${count}</span>
          </div>
          <div class="metric-card">
            <span class="metric-label">Ledger Rows</span>
            <span class="metric-value">${escapeHtml(ledgerRowsCount)}</span>
          </div>
          <div class="metric-card">
            <span class="metric-label">Governance TTL</span>
            <span class="metric-value">${escapeHtml(ttlStr)}</span>
          </div>
        </div>

        ${proposalsHtml || `<div class="proposal-card"><span class="header-subtitle">No multi-factor exclusions synthesized for this case.</span></div>`}

        <div class="card-footer">
          <span class="ai-badge">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2L13.8 8.2L20 10L13.8 11.8L12 18L10.2 11.8L4 10L10.2 8.2L12 2Z"/>
            </svg>
            <span>SecOps SDK Closed-Loop Detection Tuning Engine</span>
          </span>
          <span>Dashboard: Detection Tuning &amp; FP Reduction Command Center</span>
        </div>
      `;
    }

    renderWidget();
  </script>
</body>
</html>
