<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Correlated Silent Detections - SecOps SOAR Widget</title>
  <style>
    /* ==========================================================================
       Google SecOps SOAR Theme Variables (Self-contained, no CDN dependencies)
       ========================================================================== */
    :root,
    [data-theme="light"],
    body.light {
      --soar-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Rubik", Helvetica, Arial, sans-serif;
      --soar-font-mono: ui-monospace, SFMono-Regular, "Fira Code", Menlo, Monaco, Consolas, monospace;

      --soar-bg-page: #ffffff;
      --soar-bg-card: #ffffff;
      --soar-bg-subtle: rgba(0, 0, 0, 0.04);
      --soar-border: #e5e7eb;
      --soar-border-strong: #d1d5db;
      --soar-text-primary: #111827;
      --soar-text-secondary: #4b5563;
      --soar-text-muted: #6b7280;
      --soar-accent: #2563eb;
      --soar-accent-hover: #1d4ed8;
      --soar-accent-subtle: rgba(37, 99, 235, 0.1);

      /* Verdicts */
      --verdict-malicious-bg: #fee2e2;
      --verdict-malicious-text: #dc2626;
      --verdict-malicious-border: #fca5a5;

      --verdict-benign-bg: #ecfdf5;
      --verdict-benign-text: #059669;
      --verdict-benign-border: #a7f3d0;

      /* Severities */
      --sev-critical-bg: #fef2f2;
      --sev-critical-text: #dc2626;
      --sev-critical-border: #fca5a5;
      --sev-high-bg: #fff7ed;
      --sev-high-text: #ea580c;
      --sev-high-border: #fdba74;
      --sev-medium-bg: #fffbeb;
      --sev-medium-text: #d97706;
      --sev-medium-border: #fde68a;
      --sev-low-bg: #f3f4f6;
      --sev-low-text: #6b7280;
      --sev-low-border: #d1d5db;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --soar-bg-page: #161626;
        --soar-bg-card: #161626;
        --soar-bg-subtle: rgba(255, 255, 255, 0.06);
        --soar-border: #293140;
        --soar-border-strong: #384357;
        --soar-text-primary: #f3f4f6;
        --soar-text-secondary: #9ca3af;
        --soar-text-muted: #6b7280;
        --soar-accent: #3b82f6;
        --soar-accent-hover: #60a5fa;
        --soar-accent-subtle: rgba(59, 130, 246, 0.16);

        --verdict-malicious-bg: #3b191d;
        --verdict-malicious-text: #ff8589;
        --verdict-malicious-border: #8c1d28;

        --verdict-benign-bg: #132d21;
        --verdict-benign-text: #6ee7b7;
        --verdict-benign-border: #065f46;

        --sev-critical-bg: #450a0a;
        --sev-critical-text: #f87171;
        --sev-critical-border: #7f1d1d;
        --sev-high-bg: #431407;
        --sev-high-text: #fb923c;
        --sev-high-border: #7c2d12;
        --sev-medium-bg: #451a03;
        --sev-medium-text: #fbbf24;
        --sev-medium-border: #78350f;
        --sev-low-bg: #1f2937;
        --sev-low-text: #9ca3af;
        --sev-low-border: #374151;
      }
    }

    [data-theme="dark"], body.dark {
      --soar-bg-page: #161626;
      --soar-bg-card: #161626;
      --soar-bg-subtle: rgba(255, 255, 255, 0.06);
      --soar-border: #293140;
      --soar-border-strong: #384357;
      --soar-text-primary: #f3f4f6;
      --soar-text-secondary: #9ca3af;
      --soar-text-muted: #6b7280;
      --soar-accent: #3b82f6;
      --soar-accent-hover: #60a5fa;
      --soar-accent-subtle: rgba(59, 130, 246, 0.16);

      --verdict-malicious-bg: #3b191d;
      --verdict-malicious-text: #ff8589;
      --verdict-malicious-border: #8c1d28;

      --verdict-benign-bg: #132d21;
      --verdict-benign-text: #6ee7b7;
      --verdict-benign-border: #065f46;

      --sev-critical-bg: #450a0a;
      --sev-critical-text: #f87171;
      --sev-critical-border: #7f1d1d;
      --sev-high-bg: #431407;
      --sev-high-text: #fb923c;
      --sev-high-border: #7c2d12;
      --sev-medium-bg: #451a03;
      --sev-medium-text: #fbbf24;
      --sev-medium-border: #78350f;
      --sev-low-bg: #1f2937;
      --sev-low-text: #9ca3af;
      --sev-low-border: #374151;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background-color: var(--soar-bg-page, #ffffff);
      background: var(--soar-bg-page, #ffffff);
      font-family: var(--soar-font);
      color: var(--soar-text-primary);
      padding: 0.75rem;
      line-height: 1.5;
      font-size: 0.8125rem;
      width: 100%;
      height: auto;
    }

    .widget-container {
      width: 100%;
      max-width: 100%;
      margin: 0;
      background: transparent;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    /* Top Summary Header */
    .widget-header-card {
      background: var(--soar-bg-card);
      border: 1px solid var(--soar-border);
      border-radius: 8px;
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .header-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: var(--soar-accent-subtle);
      border: 1px solid var(--soar-accent);
      color: var(--soar-accent);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .header-icon svg {
      width: 20px;
      height: 20px;
    }
    .header-title-group {
      display: flex;
      flex-direction: column;
    }
    .header-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--soar-text-primary);
    }
    .header-subtitle {
      font-size: 0.75rem;
      color: var(--soar-text-muted);
    }

    /* Metrics Grid */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 0.75rem;
    }
    .metric-card {
      background: var(--soar-bg-card);
      border: 1px solid var(--soar-border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .metric-label {
      font-size: 0.6875rem;
      color: var(--soar-text-muted);
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    .metric-value {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--soar-text-primary);
      line-height: 1.2;
    }

    /* Status & Severity Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      font-size: 0.6875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    .badge-critical {
      background: var(--sev-critical-bg);
      color: var(--sev-critical-text);
      border: 1px solid var(--sev-critical-border);
    }
    .badge-high {
      background: var(--sev-high-bg);
      color: var(--sev-high-text);
      border: 1px solid var(--sev-high-border);
    }
    .badge-medium {
      background: var(--sev-medium-bg);
      color: var(--sev-medium-text);
      border: 1px solid var(--sev-medium-border);
    }
    .badge-low {
      background: var(--sev-low-bg);
      color: var(--sev-low-text);
      border: 1px solid var(--sev-low-border);
    }
    .badge-silent {
      background: rgba(124, 77, 255, 0.15);
      color: #9d7cfd;
      border: 1px solid rgba(124, 77, 255, 0.4);
    }
    .badge-alerting {
      background: var(--soar-accent-subtle);
      color: var(--soar-accent);
      border: 1px solid var(--soar-accent);
    }

    /* Section Titles */
    .section-title {
      font-size: 0.8125rem;
      font-weight: 600;
      margin: 0.5rem 0 0.25rem 0;
      color: var(--soar-text-primary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Tables */
    .table-container {
      width: 100%;
      border: 1px solid var(--soar-border);
      border-radius: 8px;
      overflow: hidden;
      background: var(--soar-bg-card);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    th, td {
      padding: 0.6rem 0.85rem;
      border-bottom: 1px solid var(--soar-border);
    }
    th {
      background: var(--soar-bg-subtle);
      color: var(--soar-text-muted);
      font-weight: 600;
      font-size: 0.6875rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    tr:last-child td {
      border-bottom: none;
    }
    tr:hover td {
      background: var(--soar-bg-subtle);
    }
    code {
      font-family: var(--soar-font-mono);
      font-size: 0.75rem;
      background: var(--soar-bg-subtle);
      padding: 0.15rem 0.35rem;
      border-radius: 3px;
      border: 1px solid var(--soar-border);
      color: var(--soar-text-secondary);
    }

    /* Expandable Query Section */
    details {
      background: var(--soar-bg-card);
      border: 1px solid var(--soar-border);
      border-radius: 8px;
      padding: 0.65rem 0.85rem;
    }
    summary {
      cursor: pointer;
      font-weight: 600;
      font-size: 0.75rem;
      color: var(--soar-text-secondary);
      outline: none;
      user-select: none;
    }
    summary:hover {
      color: var(--soar-accent);
    }
    .query-box {
      margin-top: 0.5rem;
      padding: 0.65rem;
      background: var(--soar-bg-subtle);
      border: 1px solid var(--soar-border);
      border-radius: 6px;
      font-family: var(--soar-font-mono);
      font-size: 0.72rem;
      color: var(--soar-text-secondary);
      white-space: pre-wrap;
      word-break: break-all;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div id="content" class="widget-container"></div>

  <script>
    // =========================================================================
    // Google SecOps SOAR Theme Synchronization Bridge
    // =========================================================================
    const SOAR_PALETTES = {
      dark: {
        theme: 'dark',
        '--soar-bg-page': '#161626',
        '--soar-bg-card': '#161626',
        '--soar-border': '#293140',
        '--soar-border-strong': '#384357',
        '--soar-text-primary': '#f3f4f6',
        '--soar-text-secondary': '#9ca3af',
        '--soar-text-muted': '#6b7280'
      },
      light: {
        theme: 'light',
        '--soar-bg-page': '#ffffff',
        '--soar-bg-card': '#ffffff',
        '--soar-border': '#e5e7eb',
        '--soar-border-strong': '#d1d5db',
        '--soar-text-primary': '#111827',
        '--soar-text-secondary': '#4b5563',
        '--soar-text-muted': '#6b7280'
      }
    };

    function isColorDark(color) {
      if (!color) return false;
      let r = 255, g = 255, b = 255;
      color = String(color).trim();
      if (color.startsWith('#')) {
        let hex = color.replace('#', '');
        if (hex.length === 3) {
          hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2];
        }
        if (hex.length >= 6) {
          r = parseInt(hex.substring(0, 2), 16);
          g = parseInt(hex.substring(2, 4), 16);
          b = parseInt(hex.substring(4, 6), 16);
        }
      } else if (color.startsWith('rgb')) {
        const parts = color.match(/\d+/g);
        if (parts && parts.length >= 3) {
          r = parseInt(parts[0], 10);
          g = parseInt(parts[1], 10);
          b = parseInt(parts[2], 10);
        }
      }
      const luminance = (0.299 * r + 0.587 * g + 0.114 * b);
      return luminance < 140;
    }

    function applySoarTheme(themeKeyOrObj) {
      const mode = typeof themeKeyOrObj === 'string' ? themeKeyOrObj : (themeKeyOrObj.theme || 'light');
      document.documentElement.setAttribute('data-theme', mode);
      document.body.className = mode;

      const palette = typeof themeKeyOrObj === 'object' ? themeKeyOrObj : (SOAR_PALETTES[mode] || SOAR_PALETTES.light);
      for (const [key, value] of Object.entries(palette)) {
        if (key.startsWith('--')) {
          document.documentElement.style.setProperty(key, value);
          document.body.style.setProperty(key, value);
        }
      }
      document.body.style.backgroundColor = palette['--soar-bg-page'] || (mode === 'dark' ? '#161626' : '#ffffff');
    }

    // Google SecOps SOAR message listeners
    window.addEventListener('message', evt => {
      if (evt.data && evt.data.background) {
        const isDark = isColorDark(evt.data.background);
        applySoarTheme(isDark ? SOAR_PALETTES.dark : SOAR_PALETTES.light);
      }
    });

    onmessage = evt => {
      if (evt.data && evt.data.background) {
        const isDark = isColorDark(evt.data.background);
        applySoarTheme(isDark ? SOAR_PALETTES.dark : SOAR_PALETTES.light);
      }
    };

    // Initial mount fallback
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      applySoarTheme(SOAR_PALETTES.dark);
    } else {
      applySoarTheme(SOAR_PALETTES.light);
    }

    // =========================================================================
    // Widget Data Parsing & Rendering
    // =========================================================================
    let rawData = null;
    try {
      rawData = [{stepInstanceName}.JsonResult];
    } catch (e) {
      rawData = null;
    }

    while (Array.isArray(rawData) && rawData.length > 0) {
      rawData = rawData[0];
    }
    if (typeof rawData === "string") {
      try { rawData = JSON.parse(rawData); } catch(e) {}
    }
    while (Array.isArray(rawData) && rawData.length > 0) {
      rawData = rawData[0];
    }

    const container = document.getElementById("content");

    if (!rawData || !rawData.case_id) {
      container.innerHTML = `
        <div class="widget-header-card">
          <div class="header-left">
            <div class="header-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
            </div>
            <div class="header-title-group">
              <span class="header-title">SecOps SDK Engine - Detection Correlation</span>
              <span class="header-subtitle">Awaiting action execution or data context...</span>
            </div>
          </div>
        </div>
      `;
    } else {
      const silentCount = rawData.silent_detections_count || 0;
      const totalDetections = rawData.detections_count || 0;
      const eventsCount = rawData.events_count || 0;
      const attachedCount = rawData.attached_count || 0;
      const attachedEntitiesCount = rawData.attached_entities_count || 0;
      const entitiesCount = rawData.entities_count || 0;
      const lookback = rawData.lookback_hours || 24;

      let html = `
        <div class="widget-header-card">
          <div class="header-left">
            <div class="header-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
              </svg>
            </div>
            <div class="header-title-group">
              <span class="header-title">Correlated Silent Detections</span>
              <span class="header-subtitle">Case #${rawData.case_id} &bull; Lookback Window: ${lookback}h</span>
            </div>
          </div>
          <div>
            ${silentCount > 0 
              ? `<span class="badge badge-high">${silentCount} Silent Detection${silentCount > 1 ? 's' : ''} Found</span>`
              : `<span class="badge badge-low">No Silent Detections</span>`
            }
          </div>
        </div>

        <div class="metrics-grid">
          <div class="metric-card">
            <span class="metric-label">Silent Detections</span>
            <span class="metric-value" style="color: ${silentCount > 0 ? 'var(--sev-high-text)' : 'var(--verdict-benign-text)'}">${silentCount}</span>
          </div>
          <div class="metric-card">
            <span class="metric-label">Total Detections</span>
            <span class="metric-value">${totalDetections}</span>
          </div>
          ${eventsCount > 0 ? `
          <div class="metric-card">
            <span class="metric-label">UDM Events</span>
            <span class="metric-value" style="color: var(--sev-medium-text)">${eventsCount}</span>
          </div>` : ''}
          <div class="metric-card">
            <span class="metric-label">Evidence Attached</span>
            <span class="metric-value" style="color: var(--soar-accent)">${attachedCount}</span>
          </div>
          <div class="metric-card">
            <span class="metric-label">Delta Entities</span>
            <span class="metric-value" style="color: var(--soar-accent)">${attachedEntitiesCount}</span>
          </div>
          <div class="metric-card">
            <span class="metric-label">Entities Scanned</span>
            <span class="metric-value">${entitiesCount}</span>
          </div>
        </div>
      `;

      const detections = rawData.detections_found || [];
      if (detections.length > 0) {
        html += `
          <div class="section-title">
            <span>Discovered Detections (${detections.length})</span>
          </div>
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>Rule Name</th>
                  <th>State</th>
                  <th>Severity</th>
                  <th>Corroborated</th>
                  <th>Event ID</th>
                </tr>
              </thead>
              <tbody>
        `;
        for (const d of detections) {
          const sev = (d.severity || "LOW").toUpperCase();
          let sevBadgeClass = "badge-low";
          if (sev.includes("CRITICAL")) sevBadgeClass = "badge-critical";
          else if (sev.includes("HIGH")) sevBadgeClass = "badge-high";
          else if (sev.includes("MED")) sevBadgeClass = "badge-medium";

          const isAlerting = d.is_alerting || d.alert_state === "ALERTING";
          const stateBadge = isAlerting 
            ? `<span class="badge badge-alerting">ALERTING</span>` 
            : `<span class="badge badge-silent">SILENT</span>`;

          const isCorroborated = d.corroborated ? `<span class="badge badge-low">YES</span>` : `<span class="badge badge-low" style="opacity:0.6">NO</span>`;
          const eid = d.event_id ? (d.event_id.length > 16 ? d.event_id.substring(0, 16) + '...' : d.event_id) : 'N/A';

          html += `
            <tr>
              <td><strong>${d.rule_name || 'Unnamed Rule'}</strong></td>
              <td>${stateBadge}</td>
              <td><span class="badge ${sevBadgeClass}">${sev}</span></td>
              <td>${isCorroborated}</td>
              <td><code>${eid}</code></td>
            </tr>
          `;
        }
        html += `</tbody></table></div>`;
      } else {
        html += `<p style="color: var(--soar-text-muted); font-size: 0.75rem;">No silent detections discovered within the ${lookback}h lookback window.</p>`;
      }

      const events = rawData.events_found || [];
      if (events.length > 0) {
        html += `
          <div class="section-title">
            <span>Discovered UDM Events (${events.length})</span>
          </div>
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>Event ID</th>
                  <th>Event Type</th>
                  <th>Product Log ID</th>
                </tr>
              </thead>
              <tbody>
        `;
        for (const ev of events.slice(0, 10)) {
          const eid = ev.event_id ? (ev.event_id.length > 20 ? ev.event_id.substring(0, 20) + '...' : ev.event_id) : 'N/A';
          html += `
            <tr>
              <td><code>${eid}</code></td>
              <td><span class="badge badge-low">${ev.event_type || 'UNKNOWN'}</span></td>
              <td><code>${ev.product_log_id || 'N/A'}</code></td>
            </tr>
          `;
        }
        html += `</tbody></table></div>`;
      }

      const attached = rawData.attached_evidences || [];
      if (attached.length > 0) {
        html += `
          <div class="section-title">
            <span>Attached Evidence Items (${attached.length})</span>
          </div>
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>Evidence Type</th>
                  <th>Evidence ID</th>
                </tr>
              </thead>
              <tbody>
        `;
        for (const ev of attached) {
          const type = ev.evidence_type || ev.evidenceType || "EVIDENCE";
          const id = ev.evidence_id || ev.evidenceId || "N/A";
          html += `
            <tr>
              <td><span class="badge badge-alerting">${type}</span></td>
              <td><code>${id}</code></td>
            </tr>
          `;
        }
        html += `</tbody></table></div>`;
      }

      if (rawData.query_used) {
        html += `
          <details>
            <summary>Correlation Query & Entities Details</summary>
            <div class="query-box">${rawData.query_used}</div>
          </details>
        `;
      }

      container.innerHTML = html;
    }
  </script>

</body>
</html>
